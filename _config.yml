title: Colecionar Relógios
description: Relógios vintage e neo-vintage com curadoria, história e identidade. Intermediadora de peças selecionadas por design, autenticidade e relevância colecionável.

url: "https://colecionarrelogios.com.br"
baseurl: ""

lang: pt-BR
timezone: America/Sao_Paulo

permalink: /:categories/:title/

paginate: 6
paginate_path: "/page:num/"

plugins:
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

author:
  name: Colecionar Relógios
  url: https://colecionarrelogios.com.br

twitter:
  username: colecionar_relogios
  card: summary_large_image

logo: /favicon.svg

social:
  name: Colecionar Relógios
  links:
    - https://colecionarrelogios.com.br
    - https://www.instagram.com/colecionar_relogios/

collections:
  posts:
    output: true

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author: Colecionar Relógios

  - scope:
      path: ""
    values:
      layout: default
