<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&display=swap" rel="stylesheet">

  {% seo %}
  {% feed_meta %}

  {% if page.thumbnail %}
    <meta property="og:image" content="{{ page.thumbnail | absolute_url }}">
    <meta property="og:image:secure_url" content="{{ page.thumbnail | absolute_url }}">
    <meta name="twitter:image" content="{{ page.thumbnail | absolute_url }}">
  {% endif %}

  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="icon" href="{{ '/favicon.svg' | relative_url }}" type="image/svg+xml">
</head>
<body>

  {% include header.html %}

  <main>
    {{ content }}
  </main>

  {% include footer.html %}

</body>
</html>
